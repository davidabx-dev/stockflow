services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stockflow_db}
      POSTGRES_USER: ${DB_USER:-stockflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockflow_user} -d ${DB_NAME:-stockflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
